name: Dense DMAP versus FlashDiffusion scaling

on:
  workflow_dispatch:
    inputs:
      collect_call_id:
        description: Optional Modal call ID to collect without waiting or submitting a new run
        default: ''
        type: string
      run_gpu:
        description: Run all six sizes on Modal using exactly one T4
        default: false
        type: boolean
      repeats:
        description: Repetitions per method and N
        default: '3'
        required: true
        type: string
      timeout:
        description: Dense timeout in seconds; 0 disables it; Flash has no deadline
        default: '0'
        required: true
        type: string
  push:
    branches: ['main', 'benchmark/dense-vs-flash-scaling']
    paths:
      - benchmarks/benchmark_dmap_scaling.py
      - benchmarks/modal_t4.py
      - .github/workflows/benchmark-dmap-scaling.yml

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU dependencies
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install "flashdiffusion @ git+https://github.com/sparsetrace/FlashDiffusion.git@f5c2d1abb7e418829651f7e2fedbb8b323fd56f9" matplotlib psutil
      - name: Regression check for disabled process deadlines
        run: python benchmarks/test_deadlines.py
      - name: Validate dense and tiled operators and eigenpairs
        run: python benchmarks/benchmark_dmap_scaling.py --device cpu --sizes 100 1000 --repeats 3 --timeout 300 --output smoke_results
      - name: Check conservative memory screening
        run: |
          python benchmarks/benchmark_dmap_scaling.py --device cpu --sizes 100 --repeats 1 --dense-mode full --dense-max-gib 0.00001 --timeout 300 --output memory_check
          python - <<'PYTEST'
          import json
          from pathlib import Path
          rows = json.loads(Path('smoke_results/results.json').read_text())['trials']
          assert len(rows) == 12 and all(r['status'] == 'ok' for r in rows)
          limited = json.loads(Path('memory_check/results.json').read_text())['trials']
          assert limited[0]['method'] == 'dense' and limited[0]['status'] == 'memory_limit'
          assert limited[0]['seconds'] is None
          assert limited[1]['method'] == 'flash' and limited[1]['status'] == 'ok'
          import importlib.util
          import numpy as np
          from types import SimpleNamespace
          spec = importlib.util.spec_from_file_location('bench', 'benchmarks/benchmark_dmap_scaling.py')
          bench = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(bench)
          x = np.random.default_rng(5).normal(size=(103, 3))
          x -= x.mean(0)
          cfg = SimpleNamespace(device='cpu', block_size=17, beta=1., alpha=.5)
          mv, degree, _ = bench.batched_dense_operator(x, cfg)
          sq = (x*x).sum(1)
          k = np.exp(-np.maximum(sq[:, None]+sq[None, :]-2*x@x.T, 0))
          w = k.sum(1)**(-cfg.alpha)
          ka = w[:, None]*k*w[None, :]
          d = ka.sum(1)
          matrix = ka/np.sqrt(d[:, None]*d[None, :])
          v = np.random.default_rng(6).normal(size=len(x))
          np.testing.assert_allclose(degree, d, rtol=1e-12, atol=1e-12)
          np.testing.assert_allclose(mv(v), matrix@v, rtol=1e-12, atol=1e-12)
          print('PASS: 12/12 trials; full memory guard; exact batched/full agreement')
          PYTEST
      - name: Record validation environment
        if: always()
        run: |
          mkdir -p smoke_results
          git rev-parse HEAD > smoke_results/commit.txt
          python -m pip freeze > smoke_results/packages.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dmap-scaling-smoke
          path: |
            smoke_results/
            memory_check/
          if-no-files-found: warn

  scaling:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.run_gpu || inputs.collect_call_id != '')
    needs: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
      REPEATS: ${{ inputs.repeats || '3' }}
      TRIAL_TIMEOUT: ${{ inputs.timeout || '0' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check Modal authentication is configured
        run: |
          if [ -z "$MODAL_TOKEN_ID" ] || [ -z "$MODAL_TOKEN_SECRET" ]; then
            echo '::error::Create repository Actions secrets MODAL_TOKEN_ID and MODAL_TOKEN_SECRET.'
            exit 1
          fi
      - name: Install Modal client
        run: python -m pip install modal==1.5.5
      - name: Deploy Modal T4 worker
        if: inputs.collect_call_id == ''
        run: python -m modal deploy benchmarks/modal_t4.py
      - name: Submit benchmark without waiting for GPU completion
        if: inputs.collect_call_id == ''
        run: >-
          python benchmarks/modal_t4.py --submit
          --repeats "$REPEATS" --trial-timeout "$TRIAL_TIMEOUT"
          --source-commit "$GITHUB_SHA" --output modal_results
      - name: Collect existing run without waiting
        if: inputs.collect_call_id != ''
        env:
          CALL_ID: ${{ inputs.collect_call_id }}
        run: python benchmarks/modal_t4.py --collect "$CALL_ID" --output modal_results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dmap-scaling-modal-t4
          path: modal_results/
          if-no-files-found: warn
          retention-days: 30
